px}.modal-backdrop{position:fixed;inset:0;background:#102a3866;display:none;place-items:center;z-index:9}.modal{background:white;width:min(560px,92vw);border-radius:10px;padding:28px;box-shadow:0 20px 90px #102a3844}.modal h2{font-size:21px;margin-top:0}.modal label{display:block;margin:15px 0 7px;color:#7e9199;font-size:12px}.modal input,.modal select{width:100%;padding:11px;border:1px solid #d7e3e6;border-radius:5px}.modal-footer{text-align:right;margin-top:24px}.toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%);background:#153e45;color:white;padding:14px 25px;border-radius:7px;display:none;z-index:20}.empty{text-align:center;padding:60px;color:#91a2a8}@media(max-width:1100px){.stats{grid-template-columns:repeat(2,1fr)}.grid,.bottom{grid-template-columns:1fr}.asset-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){aside{width:68px;padding:22px 7px}.brand{font-size:0;padding:0}.brand small,.nav-label,.aside-end,nav button .text{display:none}.logo{font-size:28px;margin:0 10px}nav{margin-top:30px}nav button{padding:12px 15px}main{margin-left:68px}header{padding:0 16px}header small{display:none}.content{padding:22px 14px}.heading{align-items:flex-start;gap:15px}.heading .btn{font-size:11px;padding:9px}.heading p{font-size:11px}h1{font-size:22px}.stats{gap:10px}.stat{padding:15px}.stat .icon{display:none}.asset-grid{grid-template-columns:1fr}.toolbar{flex-wrap:wrap}.page-foot{line-height:1.7;gap:20px}}
</style><link rel="stylesheet" href="inspection.css"></head><body><aside><div class="brand"><span class="logo">▰</span>桥安探视<small>QIAOAN INSPECTION</small></div><div class="nav-label">工作空间 / WORKSPACE</div><nav id="nav"></nav><div class="aside-end"><span class="online">● 系统运行正常</span><br>桥梁养护管理中心<br><span style="color:#64828f">工作台 · V1.0</span></div></aside><main><header><div class="crumb">工作空间 &nbsp; / &nbsp; <b id="crumb">总览工作台</b></div><div><small>2026年10月20日　星期二 &nbsp; │ &nbsp; 演示工作空间</small><span class="avatar">管</span></div></header><div class="content" id="app"></div></main><div class="modal-backdrop" id="overlay"><div class="modal" id="modal"></div></div><div class="toast" id="toast"></div><script>
function storedValue(key){try{return JSON.parse(localStorage.getItem(key)||'null')}catch{return null}}
const titles=['总览工作台','桥梁资产','巡检任务','病害管理','养护工单','报告档案'];const symbols=['▦','♧','◈','◎','▤','▥'];let current=0,filter='全部',query='';
const bridges=[{name:'滨江大桥',id:'QL-001',type:'斜拉桥',len:'1,280',score:92,area:'滨江养护片区',date:'2026-10-20'},{name:'青山特大桥',id:'QL-002',type:'连续刚构桥',len:'2,460',score:85,area:'青山养护片区',date:'2026-10-19'},{name:'望江大桥',id:'QL-003',type:'预应力箱梁桥',len:'860',score:96,area:'望江养护片区',date:'2026-10-18'},{name:'东河大桥',id:'QL-004',type:'拱桥',len:'640',score:89,area:'东河养护片区',date:'2026-10-17'},{name:'新港高架桥',id:'QL-005',type:'连续梁桥',len:'1,820',score:94,area:'新港养护片区',date:'2026-10-16'},{name:'云溪中桥',id:'QL-006',type:'简支梁桥',len:'120',score:98,area:'云溪养护片区',date:'2026-10-15'}];
let defects=storedValue('qa-defects')||[{id:'BH-2026-0281',bridge:'滨江大桥',part:'3号墩 · 右侧腹板',type:'裂缝',size:'0.24 mm / 1.82 m',risk:'重点关注',state:'待复核'},{id:'BH-2026-0280',bridge:'青山特大桥',part:'主跨 · 2号箱梁',type:'混凝土剥落',size:'0.036 m²',risk:'优先处理',state:'已复核'},{id:'BH-2026-0279',bridge:'望江大桥',part:'5号墩 · 墩身',type:'表面锈蚀',size:'0.012 m²',risk:'常规观察',state:'已归档'},{id:'BH-2026-0278',bridge:'东河大桥',part:'桥台 · 伸缩缝',type:'裂缝',size:'0.18 mm / 0.64 m',risk:'常规观察',state:'待复核'},{id:'BH-2026-0277',bridge:'滨江大桥',part:'2号墩 · 承台',type:'钢筋外露',size:'0.021 m²',risk:'重点关注',state:'已复核'}];let tasks=storedValue('qa-tasks')||[{name:'滨江大桥 · 秋季定期巡检',bridge:'滨江大桥',date:'2026-10-20',state:'进行中',progress:76},{name:'青山特大桥 · 病害专项复检',bridge:'青山特大桥',date:'2026-10-21',state:'待执行',progress:0},{name:'望江大桥 · 常规巡查',bridge:'望江大桥',date:'2026-10-18',state:'已完成',progress:100}];let orders=storedValue('qa-orders')||[];
function save(){localStorage.setItem('qa-defects',JSON.stringify(defects));localStorage.setItem('qa-tasks',JSON.stringify(tasks));localStorage.setItem('qa-orders',JSON.stringify(orders))}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function pill(s){return `<span class="pill ${/重点|待|进行/.test(s)?'warn':/优先/.test(s)?'danger':''}">${esc(s)}</span>`}function toast(s){document.getElementById('toast').textContent=s;document.getElementById('toast').style.display='block';setTimeout(()=>document.getElementById('toast').style.display='none',2800)}function closeModal(){document.getElementById('overlay').style.display='none'}function modal(s){document.getElementById('modal').innerHTML=s;document.getElementById('overlay').style.display='grid'}document.getElementById('overlay').onclick=e=>{if(e.target.id==='overlay')closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
function heading(sub,btn=''){return `<div class="heading"><div><h1>${titles[current]}</h1><p>${sub}</p></div><div>${btn}</div></div>`}function table(items){return `<div class="table-wrap"><table><thead><tr><th>病害编号 / 所属桥梁</th><th>构件位置</th><th>病害类型</th><th>风险等级</th><th>状态</th><th>操作</th></tr></thead><tbody>${items.map(d=>`<tr><td><b>${d.id}</b><div style="font-size:10px;color:#92a1a8;margin-top:6px">${esc(d.bridge)}</div></td><td>${esc(d.part)}</td><td>${esc(d.type)}</td><td>${pill(d.risk)}</td><td>${pill(d.state)}</td><td><button class="link" onclick="detail('${d.id}')">查看详情 ↗</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">没有符合条件的病害记录</td></tr>'}</tbody></table></div>`}
function map(){return `<div class="map"><div class="map-title">桥群地理分布　 /　区域示意</div><svg viewBox="0 0 800 350" role="img" aria-label="桥梁区域分布示意图"><defs><pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#e3eae6" stroke-width="1"/></pattern></defs><rect width="800" height="350" fill="url(#grid)"/><g fill="#e0eadd" stroke="#d3e0d3"><path d="M0 40L100 10 180 70 150 150 30 180Z"/><path d="M540 0L750 0 800 90 690 140 570 80Z"/><path d="M420 240L560 190 640 270 580 350 400 350Z"/></g><path d="M-20 290C100 290 150 160 300 185S460 180 500 90 650 100 820 10" fill="none" stroke="#bddeda" stroke-width="64"/><g stroke="white" fill="none" stroke-width="8"><path d="M0 80L800 280M70 350L260 0M360 350L650 0M0 220L800 120"/><path d="M0 80L800 280M70 350L260 0M360 350L650 0M0 220L800 120" stroke="#d9e1dc" stroke-width="2"/></g><g fill="#8ba49d" font-size="12"><text x="100" y="98">滨江区</text><text x="580" y="60">青山片区</text><text x="640" y="260">新港区</text><text x="275" y="300">望江片区</text></g>${[[230,185],[520,95],[375,205],[125,250],[665,145],[470,285]].map((p,i)=>`<g class="map-point" onclick="bridgeDetail(${i})"><circle cx="${p[0]}" cy="${p[1]}" r="17" fill="${i===1?'#f3ad4b':'#12a18b'}" opacity=".14"/><circle cx="${p[0]}" cy="${p[1]}" r="7" fill="${i===1?'#e4a040':'#159e8c'}" stroke="white" stroke-width="3"/><rect x="${p[0]+12}" y="${p[1]-23}" width="88" height="25" rx="4" fill="white"/><text x="${p[0]+20}" y="${p[1]-7}" font-size="11" fill="#46645e">${bridges[i].name}</text></g>`).join('')}</svg><div class="legend"><i></i>状态平稳 <i class="orange"></i>重点关注　 <span style="color:#9ca9a6">点击桥梁查看档案</span></div></div>`}
function dashboard(){return heading('掌握桥群运行状态，让每一次巡检都有据可循。','<button class="btn" onclick="exportReport()">↓ 导出简报</button><button class="btn primary" onclick="newTask()">＋ 新建巡检任务</button>')+`<div class="stats">${[['在管桥梁','06','座','♧','覆盖 6 个养护片区'],['本月巡检任务',String(tasks.length).padStart(2,'0'),'项','◈','巡检计划有序推进'],['待复核病害',String(defects.filter(d=>d.state==='待复核').length).padStart(2,'0'),'处','◎','人工复核后进入处置流程'],['养护闭环率','86.4','%','↗','较上期提升 8.2% · 示例']].map((s,i)=>`<div class="card stat"><label>${s[0]}</label><span class="icon">${s[3]}</span><strong>${s[1]}<small>${s[2]}</small></strong><footer>${i===3?'<em>↑</em>':''}${s[4]}</footer></div>`).join('')}</div><div class="grid"><section class="card"><div class="card-head"><h2>桥群运行态势</h2><small>区域总览　 ·　 6 座桥梁</small></div>${map()}</section><section class="card"><div class="card-head"><h2>本期巡检进度</h2><small>10月巡检计划</small></div><div class="progress-section"><div class="donut-wrap"><div class="donut"><div><b>76<span style="font-size:15px">%</span></b><small>当前任务完成度</small></div></div><div class="mini-stats">已采集影像<b>1,248</b><br>已巡检构件<b>38 / 50</b><br>有效飞行时长<b>86 min</b></div></div>${[['主梁结构',92],['桥墩与桥台',78],['桥面附属设施',58]].map(s=>`<div class="bar-row">${s[0]}<span>${s[1]}%</span><div class="bar"><i style="width:${s[1]}%"></i></div></div>`).join('')}</div></section></div><div class="bottom"><section class="card"><div class="card-head"><h2>近期病害记录 <small>　人工复核与处置跟踪</small></h2><button class="link" onclick="go(3)">全部病害 →</button></div>${table(defects.slice(0,4))}</section><section class="card"><div class="card-head"><h2>病害发现趋势</h2><small>近 6 期 · 演示</small></div><div class="trend"><div style="margin:12px 0;color:#85969d;font-size:11px">新增病害 <b style="font-size:24px;color:#23464c;margin:0 8px">24</b> 处　 <span style="color:#139783">↓ 16.7%</span></div><svg viewBox="0 0 340 150"><defs><linearGradient id="fade" x2="0" y2="1"><stop stop-color="#40b6a2" stop-opacity=".2"/><stop offset="1" stop-color="#40b6a2" stop-opacity="0"/></linearGradient></defs><g stroke="#eef2f3"><path d="M20 20H330M20 60H330M20 100H330"/></g><path d="M20 73L80 42 140 59 200 28 260 65 320 83V120H20Z" fill="url(#fade)"/><path d="M20 73L80 42 140 59 200 28 260 65 320 83" fill="none" stroke="#1a9f8d" stroke-width="2.5"/><g fill="#8fa0a7" font-size="10">${['05','06','07','08','09','10'].map((s,i)=>`<text x="${14+i*60}" y="143">${s}月</text>`).join('')}</g></svg><p style="font-size:11px;border-top:1px solid #eef2f3;padding-top:14px">裂缝 58%　　剥落 25%　　其他 17%</p></div></section></div>`}
function go(n){current=n;filter='全部';query='';render();window.scrollTo(0,0)}function render(){document.getElementById('nav').innerHTML=titles.map((s,i)=>`<button class="${i===current?'active':''}" onclick="go(${i})"><span>${symbols[i]}</span><span class="text" style="font-size:13px;margin:0">${s}</span></button>`).join('');document.getElementById('crumb').textContent=titles[current];let h='';if(current===0)h=dashboard();if(current===1)h=heading('一桥一档，关联构件信息、巡检记录与养护履历。')+`<div class="asset-grid">${bridges.map((b,i)=>`<article class="card asset"><div class="bridge-art">⌒╥⌒</div><h3>${b.name} <small style="font-size:11px;color:#a0adb2;float:right">${b.id}</small></h3>${pill(b.score<90?'重点关注':'状态平稳')}<div class="detail-list"><div>桥梁类型<b>${b.type}</b></div><div>桥梁全长<b>${b.len} m</b></div><div>养护片区<b>${b.area}</b></div><div>最近巡检<b>${b.date}</b></div></div><button class="btn" style="margin:0;width:100%" onclick="bridgeDetail(${i})">打开桥梁档案 →</button></article>`).join('')}</div>`;if(current===2)h=heading('从任务计划到现场采集，记录每一次巡检。','<button class="btn primary" onclick="newTask()">＋ 新建巡检任务</button>')+tasks.map((t,i)=>`<article class="card task"><div><h3>${esc(t.name)}</h3><p style="font-size:12px">${esc(t.bridge)}　│　计划日期 ${esc(t.date)}　│　常规可见光巡检</p><div class="bar" style="width:240px"><i style="width:${t.progress}%"></i></div></div><div>${pill(t.state)}<button class="link" onclick="taskDetail(${i})">查看任务 →</button></div></article>`).join('');if(current===3)h=heading('疑似病害集中复核，量测结果与处置记录可追溯。','<button class="btn" onclick="exportReport()">↓ 导出病害清单</button>')+`<div class="toolbar"><input aria-label="搜索病害" placeholder="搜索桥梁、病害编号或构件" oninput="query=this.value;updateTable()"><select aria-label="筛选病害状态" onchange="filter=this.value;updateTable()"><option>全部</option><option>待复核</option><option>已复核</option><option>已归档</option></select></div><div class="card" id="defectTable">${table(defects)}</div>`;if(current===4)h=heading('将已复核病害转化为养护任务，跟踪处置与归档。')+`<div class="notice">在“病害管理”中打开病害详情，可创建关联养护工单。</div>`+(orders.length?orders.map((o,i)=>`<article class="card task"><div><h3>${esc(o.name)}</h3><p>${esc(o.id)}　│　${esc(o.bridge)}　│　养护一组</p></div><div>${pill(o.state)}<button class="link" onclick="completeOrder(${i})">${o.state==='已归档'?'查看记录':'完成并归档'} →</button></div></article>`).join(''):'<div class="card empty">暂无养护工单，完成病害复核后即可创建。</div>');if(current===5)h=heading('巡检成果集中归档，支持清单下载与打印留存。')+`<div class="card"><div class="card-head"><h2>巡检报告与数据文件</h2><small>按当前演示数据生成</small></div>${['桥群巡检汇总报告','病害复核明细清单','桥梁资产台账'].map((s,i)=>`<div class="task" style="border-bottom:1px solid #edf1f3;margin:0"><div><h3>${s}</h3><p style="font-size:12px">2026-10-20　·　${i===1?'CSV 数据表':'HTML 可打印报告'}</p></div><button class="btn" onclick="${i===1?'exportReport()':`downloadSummary(${i})`}">↓ 生成并下载</button></div>`).join('')}</div>`;document.getElementById('app').innerHTML=h+'<footer class="page-foot"><span>桥安探视 · 桥梁裂缝智能探测系统</span><span>演示数据 / 本地保存　 ·　检测结果须经专业人员复核</span></footer>'}function updateTable(){document.getElementById('defectTable').innerHTML=table(defects.filter(d=>(filter==='全部'||d.state===filter)&&Object.values(d).join('').includes(query)))}
function bridgeDetail(i){const b=bridges[i];modal(`<h2>${b.name} <small style="font-size:13px;color:#8c9fa5">${b.id}</small></h2><p>${b.area} · ${b.type}</p><div class="detail-list"><div>桥梁全长<b>${b.len} m</b></div><div>档案完整度<b>${b.score}%</b></div><div>最近巡检<b>${b.date}</b></div><div>关联病害<b>${defects.filter(d=>d.bridge===b.name).length} 处</b></div></div><div class="notice">档案完整度为演示指标，不作为结构安全评级。可在病害管理中查看构件记录。</div><div class="modal-footer"><button class="btn" onclick="closeModal()">关闭</button><button class="btn primary" onclick="closeModal();go(3)">查看病害台账</button></div>`)}
function detail(id){const d=defects.find(x=>x.id===id);modal(`<h2>${esc(d.type)} · 病害详情</h2><p>${d.id}　${pill(d.state)}</p><div class="detail-list">${[['所属桥梁',d.bridge],['构件位置',d.part],['量测记录',d.size],['关注等级',d.risk],['发现日期','2026-10-20'],['数据来源','无人机影像 · 演示']].map(x=>`<div>${x[0]}<b>${x[1]}</b></div>`).join('')}</div><div class="notice">裂缝宽度须具备可靠尺度标定条件。当前数据用于流程展示，现场处置需结合专业复核意见。</div><div class="modal-footer"><button class="btn" onclick="closeModal()">关闭</button>${d.state==='待复核'?`<button class="btn primary" onclick="review('${id}')">确认复核</button>`:`<button class="btn primary" onclick="createOrder('${id}')">创建养护工单</button>`}</div>`)}function review(id){defects.find(x=>x.id===id).state='已复核';save();render();detail(id);toast('复核结果已保存')}function createOrder(id){if(orders.some(o=>o.source===id)){toast('该病害已有关联工单');return}const d=defects.find(x=>x.id===id);orders.push({id:'GD-2026-'+String(orders.length+1).padStart(3,'0'),name:d.type+' · 现场核查与养护处置',bridge:d.bridge,state:'待处置',source:id});save();closeModal();go(4);toast('养护工单已创建')}function completeOrder(i){if(orders[i].state==='已归档'){toast('该工单已完成，病害台账同步归档');return}orders[i].state='已归档';defects.find(d=>d.id===orders[i].source).state='已归档';save();render();toast('工单已完成，病害档案已更新')}
function newTask(){modal(`<h2>新建巡检任务</h2><p>填写计划信息，建立现场作业记录。</p><form id="taskForm"><label>任务名称</label><input name="name" required maxlength="60" placeholder="例如：滨江大桥月度巡检"><label>巡检桥梁</label><select name="bridge">${bridges.map(b=>`<option>${b.name}</option>`).join('')}</select><label>计划日期</label><input name="date" type="date" required value="2026-10-20"><div class="modal-footer"><button type="button" class="btn" onclick="closeModal()">取消</button><button class="btn primary">创建任务</button></div></form>`);document.getElementById('taskForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);tasks.unshift({name:f.get('name').trim(),bridge:f.get('bridge'),date:f.get('date'),state:'待执行',progress:0});save();closeModal();go(2);toast('巡检任务已创建')}}function taskDetail(i){const t=tasks[i];modal(`<h2>${esc(t.name)}</h2><p>${esc(t.bridge)}　·　${esc(t.date)}</p><div class="detail-list"><div>任务状态<b>${t.state}</b></div><div>采集进度<b>${t.progress}%</b></div><div>采集方式<b>无人机可见光影像</b></div><div>作业班组<b>巡检一组</b></div></div><div class="notice">任务状态用于演示巡检流程，不会控制真实飞行设备。</div><div class="modal-footer"><button class="btn" onclick="closeModal()">关闭</button>${t.state!=='已完成'?`<button class="btn primary" onclick="advanceTask(${i})">${t.state==='待执行'?'开始任务':'完成采集'}</button>`:''}</div>`)}function advanceTask(i){tasks[i].state=tasks[i].state==='待执行'?'进行中':'已完成';tasks[i].progress=tasks[i].state==='已完成'?100:10;save();render();taskDetail(i);toast('任务状态已更新')}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function exportReport(){const rows=[['病害编号','桥梁','构件','类型','量测值','关注等级','状态'],...defects.map(d=>[d.id,d.bridge,d.part,d.type,d.size,d.risk,d.state])];download('桥安探视-病害台账.csv','\ufeff'+rows.map(r=>r.map(v=>'"'+String(/^[=+@\-\t\r]/.test(String(v))?"'"+v:v).replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8');toast('病害台账已导出')}function downloadSummary(n){const body=n===2?bridges.map(b=>`<tr><td>${b.id}</td><td>${b.name}</td><td>${b.type}</td><td>${b.len}m</td></tr>`).join(''):defects.map(d=>`<tr><td>${d.id}</td><td>${esc(d.bridge)}</td><td>${esc(d.type)}</td><td>${d.state}</td></tr>`).join('');download('桥安探视-'+(n===2?'桥梁资产台账':'巡检汇总报告')+'.html',`<!doctype html><meta charset="utf-8"><title>桥安探视报告</title><style>body{font:15px sans-serif;margin:50px;color:#234}table{width:100%;border-collapse:collapse}td{padding:16px;border:1px solid #ddd}p{color:#789}</style><h1>桥安探视 · ${n===2?'桥梁资产台账':'巡检汇总报告'}</h1><p>2026-10-20 | 演示数据，须专业复核</p><table>${body}</table><p>在浏览器中按 Ctrl+P / Command+P 可打印或另存为 PDF。</p>`,'text/html;charset=utf-8');toast('报告已生成，可打开后打印')}render();
</script><script src="screening.js"></script><script src="inspection.js"></script></body></html>
